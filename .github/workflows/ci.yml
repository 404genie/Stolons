name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm sdk:build
      - run: pnpm test:client
      - name: Typecheck web and indexer together
        run: pnpm typecheck:clients
      - run: pnpm web:build
      - run: pnpm indexer:build

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libudev-dev pkg-config
      - name: Cache pinned Anchor CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/stolons-anchor
          key: anchor-${{ runner.os }}-${{ runner.arch }}-rust1.89.0-v0.32.2
      - name: Install Anchor and Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.cache/stolons-anchor/bin/anchor" ]; then
            cargo install --root "$HOME/.cache/stolons-anchor" --git https://github.com/solana-foundation/anchor --tag v0.32.2 anchor-cli --locked
          fi
          echo "$HOME/.cache/stolons-anchor/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: pnpm test
      - name: Build SBF and preserve compiler diagnostics
        shell: bash
        run: set -o pipefail && anchor build 2>&1 | tee /tmp/stolons-anchor-build.log
      - run: node scripts/check-sbf-stack.mjs /tmp/stolons-anchor-build.log
      - run: pnpm idl:sync
      - run: pnpm idl:check
