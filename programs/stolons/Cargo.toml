[package]
name = "stolons"
version = "0.1.0"
description = "Hereditary token launch protocol for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stolons"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.2", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.2", features = ["associated_token", "token"] }
solana-sha256-hasher = "=2.3.0"
# Keep Solana's transitive BLAKE3 on Digest 0.10; newer Digest 0.11
# introduces crypto-common/hybrid-array functions exceeding SBF stack limits.
blake3 = { version = "=1.8.2", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(target_os, values(\"solana\"))"] }


